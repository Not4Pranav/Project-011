# Render.com Blueprint for Discord Bot
# Deploy with: render blueprint launch

services:
  - type: web
    name: discord-bot
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discord-bot-db
          property: connectionString
      - key: DB_PASSWORD
        generateValue: true
      - key: OWNER_IDS
        sync: false
      - key: BOT_PREFIX
        value: "!"
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /
    autoDeploy: true

  - type: pserv
    name: discord-bot-db
    runtime: postgresql
    plan: free
    region: oregon
    databaseName: discord_bot
    user: bot
    ipAllowList: []